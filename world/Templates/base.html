<!DOCTYPE html>
<html>
<head>
    <title>Blog Platform</title>

    <style>
        body {
            font-family: Arial;
            margin: 0;
            background: #f4f4f4;
        }

        nav {
            background: #222;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-right: 20px;
        }

        .container {
            width: 90%;
            max-width: 1100px;
            margin: 30px auto;
        }

        .card {
            background: white;
            padding: 20px;
            margin-bottom: 20px;
            border-radius: 8px;
        }

        button, .btn {
            padding: 10px 15px;
            background: #222;
            color: white;
            border: none;
            text-decoration: none;
            cursor: pointer;
        }

        input, textarea, select {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }
    </style>
</head>

<body>

<nav>

    <a href="{% url 'home' %}">
        Blog Platform
    </a>

    {% if user.is_authenticated %}

        <a href="{% url 'dashboard' %}">
            Dashboard
        </a>

        <a href="{% url 'create_post' %}">
            Create Post
        </a>

        <a href="{% url 'logout' %}">
            Logout
        </a>

    {% else %}

        <a href="{% url 'login' %}">
            Login
        </a>

        <a href="{% url 'register' %}">
            Register
        </a>

    {% endif %}

</nav>


<div class="container">

    {% block content %}
    {% endblock %}

</div>

</body>
</html>
